[env:tiko]
platform = espressif32@6.13.0
board = tiko-cc1101
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUSER_SETUP_LOADED
  -DST7789_DRIVER
  -DTFT_WIDTH=170
  -DTFT_HEIGHT=320
  -DTFT_INVERSION_ON
  -DTFT_MISO=10
  -DTFT_MOSI=9
  -DTFT_SCLK=11
  -DTFT_CS=41
  -DTFT_DC=16
  -DTFT_RST=-1
  -DUSE_HSPI_PORT
  -DSUPPORT_TRANSACTIONS
  -DSPI_FREQUENCY=40000000
lib_deps = https://github.com/Bodmer/TFT_eSPI.git#317ce97e598c004d158b87d01940a31acfb3eced
monitor_speed = 115200
